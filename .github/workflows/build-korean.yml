name: Build Korean CIA

on:
  workflow_dispatch:
  push:
    branches: [korean]
    tags: ['v*-KR*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install 3DS libraries and tools
        run: |
          dkp-pacman -Sy --noconfirm --needed 3ds-curl 3ds-mbedtls 3ds-jansson 3ds-cmake || true
          apt-get update && apt-get install -y --no-install-recommends cmake unzip curl ca-certificates
          mkdir -p "$GITHUB_WORKSPACE/tools" && cd "$GITHUB_WORKSPACE/tools"
          curl -fsSL -o makerom.zip https://github.com/3DSGuy/Project_CTR/releases/download/makerom-v0.18.4/makerom-v0.18.4-ubuntu_x86_64.zip
          unzip -o makerom.zip && chmod +x makerom
          curl -fsSL -o bannertool.zip https://github.com/diasurgical/bannertool/releases/download/1.2.0/bannertool.zip
          unzip -o bannertool.zip
          cp linux-x86_64/bannertool ./bannertool && chmod +x bannertool
          ls -la

      - name: Build
        env:
          MAKEROM: ${{ github.workspace }}/tools/makerom
          BANNERTOOL: ${{ github.workspace }}/tools/bannertool
        run: |
          chmod +x platform/3ds/build-kr.sh
          platform/3ds/build-kr.sh

      - name: Verify outputs
        run: |
          cd build-3ds-kr/game
          ls -la *.cia *.3dsx
          test -s zelda3-3ds-kr-v3.2-KR1.cia
          test -s zelda3-3ds-kr-v3.2-KR1.3dsx
          {
            echo "### Korean build outputs"
            echo '```'
            ls -la *.cia *.3dsx
            sha1sum *.cia *.3dsx
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: zelda3-3ds-korean
          path: |
            build-3ds-kr/game/*.cia
            build-3ds-kr/game/*.3dsx

      # A pushed v*-KR* tag publishes the build as the latest GitHub release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Zelda ALttP 3DS 한국어판 ${{ github.ref_name }}
          body_path: .github/release-notes-kr.md
          make_latest: true
          files: |
            build-3ds-kr/game/*.cia
            build-3ds-kr/game/*.3dsx
